# Local / demo stack: PostgreSQL + CIMS backend + admission portal.
#   docker compose up --build
# Portal: http://localhost:8081   API docs: http://localhost:8085/swagger-ui.html
# Host ports avoid clashes with other local projects: PostgreSQL 5434, API 8085.
services:
  db:
    image: postgres:16-alpine
    environment:
      # Cluster superuser, for administration only. The app connects as the
      # non-superuser role "cims" created by docker/db-init (row-level security).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes:
      - cims-db:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cims"]
      interval: 5s
      retries: 10

  # Mock mail server for development: CIMS emails are caught here and read at http://localhost:8027
  #   docker compose up -d mailpit   and run the backend with CIMS_EMAIL_MODE=smtp
  mailpit:
    image: axllent/mailpit:v1.20
    # change the host ports if they are taken: MAILPIT_SMTP_PORT (then CIMS_SMTP_PORT to match) and MAILPIT_UI_PORT
    ports: ["${MAILPIT_SMTP_PORT:-1027}:1025", "${MAILPIT_UI_PORT:-8027}:8025"]

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: dev            # demo institution + OTP shown on screen; remove in production
      CIMS_DB_URL: jdbc:postgresql://db:5432/cims
      CIMS_DB_USER: cims
      CIMS_DB_PASSWORD: cims
      CIMS_CORS_ORIGINS: http://localhost:8081
    ports: ["8085:8085"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8081:80"]

  # Development stand-ins for the government systems (profile "mocks"):  docker compose --profile mocks up -d gov-mocks nactvet-mock
  # then run the backend with profiles dev,gov-mocks,nactvet-mock. Dashboards: http://localhost:8098 and http://localhost:8099
  gov-mocks:
    profiles: [mocks]
    build: ./gov-mocks
    environment:
      MOCK_CIMS_URL: ${MOCK_CIMS_URL:-http://host.docker.internal:8085}   # GePG callbacks to the backend running on the host
      MOCK_GEPG_KEYSTORE: /keys/gepg-mock-test.p12
      MOCK_GEPG_SP_CERTIFICATE: /keys/cims-sp-test.crt
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./dev-keys:/keys:ro"]
    ports: ["8098:8098"]

  nactvet-mock:
    profiles: [mocks]
    build: ./nactvet-mock
    environment:
      MOCK_STATE_FILE: /data/nactvet-mock-state.json
    volumes: ["nactvet-mock:/data"]
    ports: ["8099:8099"]

volumes:
  cims-db:
  nactvet-mock:
