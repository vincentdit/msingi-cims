# Local / demo stack: PostgreSQL + CIMS backend + admission portal.
#   docker compose up --build
# Portal: http://localhost:8081   API docs: http://localhost:8085/swagger-ui.html
# Host ports avoid clashes with other local projects: PostgreSQL 5434, API 8085.
services:
  db:
    image: postgres:16-alpine
    environment:
      # Cluster superuser, for administration only. The app connects as the
      # non-superuser role "cims" created by docker/db-init (row-level security).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes:
      - cims-db:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cims"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: dev            # demo institution + OTP shown on screen; remove in production
      CIMS_DB_URL: jdbc:postgresql://db:5432/cims
      CIMS_DB_USER: cims
      CIMS_DB_PASSWORD: cims
      CIMS_CORS_ORIGINS: http://localhost:8081
    ports: ["8085:8085"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  cims-db:
