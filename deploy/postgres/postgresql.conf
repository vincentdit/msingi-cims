# PostgreSQL settings for CIMS production (NFR-AVL-02/03). Size shared_buffers and effective_cache_size to the server.
listen_addresses = '*'
max_connections = 200
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
random_page_cost = 1.1

# Point-in-time recovery: every WAL segment is archived, and a segment is closed at least every 15 minutes, so at most
# 15 minutes of work can be lost (RPO). The backup service encrypts the archive and ships it off the server.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /wal/%f && cp %p /wal/%f'
archive_timeout = 900
max_wal_senders = 3

# Logs to stdout for the central log collector
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
timezone = 'Africa/Dar_es_Salaam'
