# Who may connect to the CIMS database (read through hba_file in postgresql.conf / postgresql.small.conf).
# Same rules as the postgres image's own file, plus replication over the compose network for the backup service's
# pg_basebackup (point-in-time recovery, NFR-AVL-02). The database port is not published outside the compose network.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     postgres        samenet                 scram-sha-256
host    all             all             all                     scram-sha-256
