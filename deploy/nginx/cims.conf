# TLS reverse proxy for CIMS (NFR-SEC-03). Each institution has its own sub-domain (e.g. dit.cims.co.tz) or its own domain;
# the backend resolves the institution from the Host header, so it is passed through unchanged.
# Certificates: deploy/certs/fullchain.pem and privkey.pem (a wildcard certificate for *.cims.co.tz plus any own domains).

server_tokens off;
client_max_body_size 25m;                       # document uploads and import files

# HTTP: only the ACME challenge, everything else to HTTPS
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # API and integration callbacks (GePG, collectors, SMS delivery reports)
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # health for the load balancer / uptime monitor; the rest of actuator stays inside
    location = /actuator/health/liveness { proxy_pass http://backend:8085; }
    location = /actuator/health/readiness { proxy_pass http://backend:8085; }
    location /actuator/ { return 404; }

    # the web app (static files and its routes)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
