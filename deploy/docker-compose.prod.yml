# CIMS production stack (one server): PostgreSQL with WAL archiving, the CIMS backend, the web app, a TLS reverse proxy
# and encrypted backups. See deploy/README.md.
#
#   cp deploy/.env.example deploy/.env      # fill in every value marked CHANGE
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Only the proxy publishes ports (80 → 443 redirect, 443). The database and the backend are reachable only inside the
# compose network.
name: cims

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      CIMS_DB_PASSWORD: ${CIMS_DB_PASSWORD:?set CIMS_DB_PASSWORD}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - wal-archive:/wal
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cims"]
      interval: 10s
      retries: 10
    shm_size: 256mb

  backend:
    build: ../backend
    image: ${CIMS_IMAGE_PREFIX:-msingi}/cims-backend:${CIMS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CIMS_DB_URL: jdbc:postgresql://db:5432/cims
      CIMS_DB_USER: cims
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Duser.timezone=Africa/Dar_es_Salaam"
    volumes:
      - ./secrets:/run/secrets/cims:ro          # GePG keystore and certificate, JWT keys (see README)
    healthcheck:
      # the JRE image has no curl: a plain TCP check of the port, then the health endpoint through the proxy
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085' || exit 1"]
      interval: 15s
      retries: 20
      start_period: 90s

  frontend:
    build: ../frontend
    image: ${CIMS_IMAGE_PREFIX:-msingi}/cims-frontend:${CIMS_VERSION:-latest}
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/cims.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro             # fullchain.pem and privkey.pem (wildcard for the institutions' sub-domains)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/actuator/health/liveness >/dev/null || exit 1"]
      interval: 30s
      retries: 5

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PGDATABASE: cims
      BACKUP_PASSPHRASE_FILE: /run/secrets/cims/backup-passphrase
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-15 1 * * *}
      BACKUP_DAILY_KEEP_DAYS: ${BACKUP_DAILY_KEEP_DAYS:-35}
      BACKUP_MONTHLY_KEEP_MONTHS: ${BACKUP_MONTHLY_KEEP_MONTHS:-12}
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
    volumes:
      - backups:/backups
      - wal-archive:/wal
      - ./secrets:/run/secrets/cims:ro

volumes:
  db-data:
  wal-archive:
  backups:
