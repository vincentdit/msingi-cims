spring:
  datasource:
    url: ${CIMS_TEST_DB_URL:jdbc:postgresql://localhost:5434/cims_test}
    username: ${CIMS_TEST_DB_USER:cims}
    password: ${CIMS_TEST_DB_PASSWORD:cims}
  flyway:
    clean-disabled: false
cims:
  otp:
    expose-in-response: true
  demo:
    seed: false
  offers:
    expiry-cron: "-"            # tests call the expiry job directly
  sms:
    mode: simulated
    async: false                # send in the request thread after commit, so tests see the result
    retry-cron: "-"
    callback-secret: test-sms-secret
  gepg:
    mode: simulated
    callback-secret: test-secret
logging:
  level:
    tz.co.msingi.cims: INFO
    org.hibernate.SQL: WARN
