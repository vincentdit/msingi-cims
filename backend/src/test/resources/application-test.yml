spring:
  datasource:
    url: ${CIMS_TEST_DB_URL:jdbc:postgresql://localhost:5434/cims_test}
    username: ${CIMS_TEST_DB_USER:cims}
    password: ${CIMS_TEST_DB_PASSWORD:cims}
  flyway:
    clean-disabled: false
cims:
  jobs:
    hold-minimum: false       # tests call jobs back to back; production keeps each job's minimum hold
  otp:
    expose-in-response: true
  demo:
    seed: false
  offers:
    expiry-cron: "-"            # tests call the expiry job directly
  admission:
    fee-reminder-cron: "-"      # tests call the reminders directly
  sms:
    mode: simulated
    async: false                # send in the request thread after commit, so tests see the result
    retry-cron: "-"
    callback-secret: test-sms-secret
  gepg:
    mode: simulated
    callback-secret: test-secret
    live:
      # TEST-ONLY keys: the signed XML callbacks are exercised while bills still go to the simulator
      keystore: ../dev-keys/cims-sp-test.p12
      keystore-password: test-only-not-secret
      key-alias: cims-sp
      gepg-certificate: ../dev-keys/gepg-mock-test.crt
  email:
    mode: simulated
    async: false
    retry-cron: "-"
  reports:
    schedule-cron: "-"
  helpdesk:
    sla-cron: "-"               # tests call the job directly
    public-requests-per-hour: 1000
    public-lookups-per-minute: 1000
  billing:
    cron: "-"
    callback-secret: test-billing-secret
  finance:
    reminder-cron: "-"
  privacy:
    retention-cron: "-"
  collection:
    mode: simulated
    callback-secret: test-collection-secret
  necta:
    mode: simulated
    lookup-rate-limit: 100000   # test helpers look up many simulated candidates
logging:
  level:
    tz.co.msingi.cims: INFO
    org.hibernate.SQL: WARN
