# Local development profile: demo institution, OTP codes returned in API responses,
# simulated NECTA and GePG. Start with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
cims:
  otp:
    expose-in-response: true
  demo:
    seed: true
  platform:
    # development only: the platform console sign-in msingi / Msingi@2026
    bootstrap-password: ${CIMS_PLATFORM_BOOTSTRAP_PASSWORD:Msingi@2026}
    bootstrap-must-change: false
    staff-login-url: http://{host}:5173/staff/login
  documents:
    verification-url: ${CIMS_VERIFICATION_URL:http://localhost:5173/verify/{code}}   # the Vite dev portal
    portal-url: ${CIMS_PORTAL_URL:http://localhost:5173}

logging:
  level:
    tz.co.msingi.cims: INFO
