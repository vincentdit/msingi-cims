spring:
  application:
    name: cims-backend
  mail:                                   # used when cims.email.mode=smtp; Mailpit (docker compose up -d mailpit) listens on 1027
    host: ${CIMS_SMTP_HOST:localhost}
    port: ${CIMS_SMTP_PORT:1027}
    username: ${CIMS_SMTP_USERNAME:}
    password: ${CIMS_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${CIMS_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${CIMS_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  datasource:
    url: ${CIMS_DB_URL:jdbc:postgresql://localhost:5434/cims}
    username: ${CIMS_DB_USER:cims}
    password: ${CIMS_DB_PASSWORD:cims}
    hikari:
      maximum-pool-size: ${CIMS_DB_POOL:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8085}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # served inside the network only: the proxy exposes just the health probes
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false        # the outbox retries when the mail server is down; it must not mark CIMS unhealthy

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cims:
  platform:
    # The first Msingi platform administrator, created at start-up when there is none (must change the password at first sign-in)
    bootstrap-username: ${CIMS_PLATFORM_BOOTSTRAP_USERNAME:msingi}
    bootstrap-password: ${CIMS_PLATFORM_BOOTSTRAP_PASSWORD:}
    # Integration call log kept for this many days
    integration-log-retention-days: ${CIMS_INTEGRATION_LOG_RETENTION_DAYS:365}
  security:
    mode: ${CIMS_SECURITY_MODE:local}
    issuer: ${CIMS_JWT_ISSUER:cims}
    access-token-ttl: ${CIMS_ACCESS_TOKEN_TTL:60m}
    private-key-pem: ${CIMS_JWT_PRIVATE_KEY:}
    public-key-pem: ${CIMS_JWT_PUBLIC_KEY:}
    keycloak-issuer-uri: ${CIMS_KEYCLOAK_ISSUER_URI:}
    max-failed-logins: 5
    cors-allowed-origins: ${CIMS_CORS_ORIGINS:http://localhost:5173}
    # encrypts authenticator-app secrets (base64 of 32 random bytes: openssl rand -base64 32); keep it with the database backups
    data-key: ${CIMS_DATA_KEY:}
  otp:
    length: 6
    ttl: 10m
    max-attempts: 5
    expose-in-response: false     # NEVER true in production
  gepg:
    mode: ${CIMS_GEPG_MODE:simulated}
    callback-secret: ${CIMS_GEPG_CALLBACK_SECRET:change-me}
    control-number-validity: 7d
    # Live GePG (CIMS_GEPG_MODE=live): signed XML per the GePG specification. The SP code, sub SP code, system id and default
    # GFS code are each institution's (Integrations page). Run the gov-mocks project to try it without GePG (profile gov-mocks).
    live:
      base-url: ${CIMS_GEPG_URL:https://uat1.gepg.go.tz}
      bill-path: ${CIMS_GEPG_BILL_PATH:/api/bill/sigqrequest}
      reconciliation-path: ${CIMS_GEPG_RECON_PATH:/api/reconciliations/sig_sp_qrequest}
      keystore: ${CIMS_GEPG_KEYSTORE:}               # PKCS#12 with the institution's (or integrator's) signing key
      keystore-password: ${CIMS_GEPG_KEYSTORE_PASSWORD:}
      key-alias: ${CIMS_GEPG_KEY_ALIAS:}
      gepg-certificate: ${CIMS_GEPG_CERTIFICATE:}    # GePG's public certificate (PEM or DER)
  collection:                       # private and faith-based institutions: fees paid into their own mobile money and bank accounts
    mode: ${CIMS_COLLECTION_MODE:simulated}   # simulated | statement (confirm from the day's statement until a collector adapter is added)
    callback-secret: ${CIMS_COLLECTION_CALLBACK_SECRET:change-me}
  necta:
    # simulated (development) or live: the NECTA results API used by NOAS. Live needs NECTA_API_KEY.
    mode: ${CIMS_NECTA_MODE:simulated}
    base-url: ${CIMS_NECTA_BASE_URL:https://api.necta.go.tz}
    results-path: /api/results/individual
    api-key: ${NECTA_API_KEY:}
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    lookup-rate-limit: 20       # public index-number look-ups per minute per client address
  nactvet:
    # Admission verification: simulated (in CIMS) or live (HTTP; run the nactvet-mock project to try it without NACTVET)
    mode: ${CIMS_NACTVET_MODE:simulated}
    verification:
      # NOAS-style endpoints. Placeholders until NACTVET publishes its admission verification API; nactvet-mock answers them.
      base-url: ${CIMS_NACTVET_VERIFICATION_URL:${cims.nactvet.awards.base-url}}
      submit-path: ${CIMS_NACTVET_SUBMIT_PATH:/nacteapi/index.php/api-out-service/admissionverification}
      results-path: ${CIMS_NACTVET_RESULTS_PATH:/nacteapi/index.php/api-out-service/admissionverificationresults}
      confirm-path: ${CIMS_NACTVET_CONFIRM_PATH:/nacteapi/index.php/api-out-service/admissionconfirmation}
      authorization: ${CIMS_NACTVET_VERIFICATION_AUTHORIZATION:${cims.nactvet.awards.authorization}}
      api-code: ${CIMS_NACTVET_VERIFICATION_API_CODE:${cims.nactvet.awards.api-code}}
      # Development against nactvet-mock only: show the confirmation code the mock "sent by SMS" on screen
      mock-codes: ${CIMS_NACTVET_MOCK_CODES:false}
    awards:
      # NTA awards of applicants (NACTVET particulars, as in NOAS): simulated or live. Live needs NACTE_AUTHORIZATION and NACTE_API_CODE.
      mode: ${CIMS_NACTVET_AWARDS_MODE:simulated}
      base-url: ${CIMS_NACTE_BASE_URL:https://www.nacte.go.tz}
      particulars-path: /nacteapi/index.php/api-out-service/particulars
      authorization: ${NACTE_AUTHORIZATION:}
      api-code: ${NACTE_API_CODE:}
      prefer-ip: ${NACTE_PREFER_IP:}
    catalogue:
      # Registered institutions and their programmes (NACTVET api-out-service/institutionprogrammeall, as in NOAS), for the
      # platform console. Live by default whenever the awards service is live, with the same NACTE credentials.
      mode: ${CIMS_NACTVET_CATALOGUE_MODE:${cims.nactvet.awards.mode}}
      catalogue-path: /nacteapi/index.php/api-out-service/institutionprogrammeall
      page-size: ${CIMS_NACTVET_CATALOGUE_PAGE_SIZE:200}
    submission:
      # Student registration (FR-REG-07) and results (FR-EXM-11) by API: simulated (in CIMS) or live (nactvet-mock answers them).
      # The paths are placeholders until NACTVET publishes these services; the file exports remain available either way.
      mode: ${CIMS_NACTVET_SUBMISSION_MODE:simulated}
      base-url: ${CIMS_NACTVET_SUBMISSION_URL:${cims.nactvet.awards.base-url}}
      registration-path: /nacteapi/index.php/api-out-service/studentregistration
      registration-status-path: /nacteapi/index.php/api-out-service/studentregistrationstatus
      results-path: /nacteapi/index.php/api-out-service/resultsubmission
      results-status-path: /nacteapi/index.php/api-out-service/resultsubmissionstatus
      authorization: ${cims.nactvet.verification.authorization}
      api-code: ${cims.nactvet.verification.api-code}
  # HESLB (FR-INT-05), NIDA (FR-INT-06), MUSE (FR-INT-07) and TAMISEMI (FR-INT-08): simulated (in CIMS) or live (JSON over HTTPS
  # with an API key). The paths are placeholders until each body issues its interface document; gov-mocks answers them.
  heslb:
    mode: ${CIMS_HESLB_MODE:simulated}
    base-url: ${CIMS_HESLB_URL:https://olas.heslb.go.tz}
    api-key: ${CIMS_HESLB_API_KEY:}
    registrations-path: /heslb/api/v1/registrations
    beneficiaries-path: /heslb/api/v1/beneficiaries
    disbursements-path: /heslb/api/v1/disbursements
  nida:
    mode: ${CIMS_NIDA_MODE:simulated}
    base-url: ${CIMS_NIDA_URL:https://services.nida.go.tz}
    api-key: ${CIMS_NIDA_API_KEY:}
    verify-path: /nida/api/v1/verify
  muse:
    mode: ${CIMS_MUSE_MODE:simulated}
    base-url: ${CIMS_MUSE_URL:https://muse.mof.go.tz}
    api-key: ${CIMS_MUSE_API_KEY:}
    journals-path: /muse/api/v1/journals
  tamisemi:
    mode: ${CIMS_TAMISEMI_MODE:simulated}
    base-url: ${CIMS_TAMISEMI_URL:https://selform.tamisemi.go.tz}
    api-key: ${CIMS_TAMISEMI_API_KEY:}
    selections-path: /tamisemi/api/v1/selections
  documents:
    # Link printed in the QR code of admission letters; {host} is the institution's primary domain
    verification-url: ${CIMS_VERIFICATION_URL:https://{host}/verify/{code}}
    # The portal address in links sent by SMS and email (workplace assessment, tracer surveys); {host} as above
    portal-url: ${CIMS_PORTAL_URL:https://{host}}
  offers:
    expiry-cron: ${CIMS_OFFER_EXPIRY_CRON:0 5 * * * *}   # close expired offers hourly; "-" disables
  admission:
    fee-reminder-cron: ${CIMS_FEE_REMINDER_CRON:0 0 9 * * *}   # application-fee reminders each morning; "-" disables
  sms:
    mode: ${CIMS_SMS_MODE:simulated}             # simulated = messages written to the log; live = aggregator adapter
    callback-secret: ${CIMS_SMS_CALLBACK_SECRET:change-me}   # HMAC key for delivery reports
    async: true                                  # hand messages to the gateway on a background thread after commit
    retry-cron: ${CIMS_SMS_RETRY_CRON:30 * * * * *}  # retry messages still queued; "-" disables
  email:
    mode: ${CIMS_EMAIL_MODE:simulated}            # simulated = written to the log and the outbox; smtp = spring.mail.* (Mailpit in development)
    from: ${CIMS_EMAIL_FROM:no-reply@cims.msingi.co.tz}
    async: true
    retry-cron: ${CIMS_EMAIL_RETRY_CRON:0 */5 * * * *}
  privacy:
    notice-version: "2026-10"
    retention-cron: ${CIMS_RETENTION_CRON:0 0 2 1 * *}   # monthly; runs only where the institution switched it on
  demo:
    seed: false

logging:
  level:
    tz.co.msingi.cims: INFO
