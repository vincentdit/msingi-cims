spring:
  application:
    name: cims-backend
  datasource:
    url: ${CIMS_DB_URL:jdbc:postgresql://localhost:5434/cims}
    username: ${CIMS_DB_USER:cims}
    password: ${CIMS_DB_PASSWORD:cims}
    hikari:
      maximum-pool-size: ${CIMS_DB_POOL:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8085}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cims:
  platform:
    # The first Msingi platform administrator, created at start-up when there is none (must change the password at first sign-in)
    bootstrap-username: ${CIMS_PLATFORM_BOOTSTRAP_USERNAME:msingi}
    bootstrap-password: ${CIMS_PLATFORM_BOOTSTRAP_PASSWORD:}
    # Integration call log kept for this many days
    integration-log-retention-days: ${CIMS_INTEGRATION_LOG_RETENTION_DAYS:365}
  security:
    mode: ${CIMS_SECURITY_MODE:local}
    issuer: ${CIMS_JWT_ISSUER:cims}
    access-token-ttl: ${CIMS_ACCESS_TOKEN_TTL:60m}
    private-key-pem: ${CIMS_JWT_PRIVATE_KEY:}
    public-key-pem: ${CIMS_JWT_PUBLIC_KEY:}
    keycloak-issuer-uri: ${CIMS_KEYCLOAK_ISSUER_URI:}
    max-failed-logins: 5
    cors-allowed-origins: ${CIMS_CORS_ORIGINS:http://localhost:5173}
  otp:
    length: 6
    ttl: 10m
    max-attempts: 5
    expose-in-response: false     # NEVER true in production
  gepg:
    mode: ${CIMS_GEPG_MODE:simulated}
    callback-secret: ${CIMS_GEPG_CALLBACK_SECRET:change-me}
    control-number-validity: 7d
  necta:
    # simulated (development) or live: the NECTA results API used by NOAS. Live needs NECTA_API_KEY.
    mode: ${CIMS_NECTA_MODE:simulated}
    base-url: ${CIMS_NECTA_BASE_URL:https://api.necta.go.tz}
    results-path: /api/results/individual
    api-key: ${NECTA_API_KEY:}
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    lookup-rate-limit: 20       # public index-number look-ups per minute per client address
  nactvet:
    # Admission verification: simulated (in CIMS) or live (HTTP; run the nactvet-mock project to try it without NACTVET)
    mode: ${CIMS_NACTVET_MODE:simulated}
    verification:
      # NOAS-style endpoints. Placeholders until NACTVET publishes its admission verification API; nactvet-mock answers them.
      base-url: ${CIMS_NACTVET_VERIFICATION_URL:${cims.nactvet.awards.base-url}}
      submit-path: ${CIMS_NACTVET_SUBMIT_PATH:/nacteapi/index.php/api-out-service/admissionverification}
      results-path: ${CIMS_NACTVET_RESULTS_PATH:/nacteapi/index.php/api-out-service/admissionverificationresults}
      confirm-path: ${CIMS_NACTVET_CONFIRM_PATH:/nacteapi/index.php/api-out-service/admissionconfirmation}
      authorization: ${CIMS_NACTVET_VERIFICATION_AUTHORIZATION:${cims.nactvet.awards.authorization}}
      api-code: ${CIMS_NACTVET_VERIFICATION_API_CODE:${cims.nactvet.awards.api-code}}
      # Development against nactvet-mock only: show the confirmation code the mock "sent by SMS" on screen
      mock-codes: ${CIMS_NACTVET_MOCK_CODES:false}
    awards:
      # NTA awards of applicants (NACTVET particulars, as in NOAS): simulated or live. Live needs NACTE_AUTHORIZATION and NACTE_API_CODE.
      mode: ${CIMS_NACTVET_AWARDS_MODE:simulated}
      base-url: ${CIMS_NACTE_BASE_URL:https://www.nacte.go.tz}
      particulars-path: /nacteapi/index.php/api-out-service/particulars
      authorization: ${NACTE_AUTHORIZATION:}
      api-code: ${NACTE_API_CODE:}
      prefer-ip: ${NACTE_PREFER_IP:}
    catalogue:
      # Registered institutions and their programmes (NACTVET api-out-service/institutionprogrammeall, as in NOAS), for the
      # platform console. Live by default whenever the awards service is live, with the same NACTE credentials.
      mode: ${CIMS_NACTVET_CATALOGUE_MODE:${cims.nactvet.awards.mode}}
      catalogue-path: /nacteapi/index.php/api-out-service/institutionprogrammeall
      page-size: ${CIMS_NACTVET_CATALOGUE_PAGE_SIZE:200}
  documents:
    # Link printed in the QR code of admission letters; {host} is the institution's primary domain
    verification-url: ${CIMS_VERIFICATION_URL:https://{host}/verify/{code}}
  offers:
    expiry-cron: ${CIMS_OFFER_EXPIRY_CRON:0 5 * * * *}   # close expired offers hourly; "-" disables
  sms:
    mode: ${CIMS_SMS_MODE:simulated}             # simulated = messages written to the log; live = aggregator adapter
    callback-secret: ${CIMS_SMS_CALLBACK_SECRET:change-me}   # HMAC key for delivery reports
    async: true                                  # hand messages to the gateway on a background thread after commit
    retry-cron: ${CIMS_SMS_RETRY_CRON:30 * * * * *}  # retry messages still queued; "-" disables
  privacy:
    notice-version: "2026-10"
  demo:
    seed: false

logging:
  level:
    tz.co.msingi.cims: INFO
