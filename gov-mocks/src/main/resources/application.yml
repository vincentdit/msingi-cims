server:
  port: ${MOCK_PORT:8098}

spring:
  application:
    name: gov-mocks

mock:
  # Where CIMS runs: GePG's control numbers, payments and reconciliations are posted here
  cims-url: ${MOCK_CIMS_URL:http://localhost:8085}
  gepg:
    # TEST-ONLY keys from ../dev-keys (see dev-keys/README.md). Never use these with the real GePG.
    keystore: ${MOCK_GEPG_KEYSTORE:../dev-keys/gepg-mock-test.p12}
    keystore-password: ${MOCK_GEPG_KEYSTORE_PASSWORD:test-only-not-secret}
    key-alias: ${MOCK_GEPG_KEY_ALIAS:gepg}
    # CIMS's certificate, to check its signatures
    sp-certificate: ${MOCK_GEPG_SP_CERTIFICATE:../dev-keys/cims-sp-test.crt}
    control-number-path: /api/integrations/gepg/control-number
    payment-path: /api/integrations/gepg/payment-notification
    reconciliation-path: /api/integrations/gepg/reconciliation
    # How long GePG takes to send the control number and the reconciliation
    delay-ms: ${MOCK_GEPG_DELAY_MS:1500}
  # API keys CIMS must send in X-Api-Key (CIMS_HESLB_API_KEY etc. on the CIMS side). Not real keys.
  heslb:
    api-key: ${MOCK_HESLB_API_KEY:mock-heslb-key}
  nida:
    api-key: ${MOCK_NIDA_API_KEY:mock-nida-key}
  muse:
    api-key: ${MOCK_MUSE_API_KEY:mock-muse-key}
  tamisemi:
    api-key: ${MOCK_TAMISEMI_API_KEY:mock-tamisemi-key}
  nhif:
    api-key: ${MOCK_NHIF_API_KEY:mock-nhif-key}
    # Seconds before NHIF has decided a registration batch (PENDING until then)
    processing-seconds: ${MOCK_NHIF_PROCESSING_SECONDS:5}
