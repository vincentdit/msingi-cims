# CIMS continuous integration: backend tests against PostgreSQL 16 (row-level security as in production), the mock
# servers' tests, the web app's type check and build, and the Docker images. Runs on every push and pull request.
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CIMS_TEST_DB_URL: jdbc:postgresql://localhost:5432/cims_test
      CIMS_TEST_DB_USER: cims
      CIMS_TEST_DB_PASSWORD: cims
    steps:
      - uses: actions/checkout@v4
      - name: Application role without superuser or BYPASSRLS, as in production
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE cims LOGIN PASSWORD 'cims' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "CREATE DATABASE cims_test OWNER cims"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  mocks:
    name: Mock servers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        project: [gov-mocks, nactvet-mock]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: ${{ matrix.project }}
        run: mvn -B -ntp verify

  frontend:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: Dependency audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Unit tests (back-office Kiswahili)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  scripts:
    name: Deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          shellcheck -S warning deploy/backup/*.sh deploy/db-init/*.sh
      - name: Compose files
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env config -q
          docker compose config -q

  images:
    name: Docker images
    needs: [backend, frontend, mocks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: cims-backend, context: backend }
          - { name: cims-frontend, context: frontend }
          - { name: cims-backup, context: deploy/backup }
          - { name: cims-gov-mocks, context: gov-mocks }
          - { name: cims-nactvet-mock, context: nactvet-mock }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
