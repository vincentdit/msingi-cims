# Load test against a staging installation (NFR-PER-01/02), started by hand. Never point it at production during the day.
name: Load test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging address, e.g. https://demo.staging.cims.co.tz"
        required: true
      tenant:
        description: "Institution code (X-Tenant)"
        default: DEMO
      profile:
        description: "smoke, normal or peak"
        default: smoke
        type: choice
        options: [smoke, normal, peak]

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run
        env:
          BASE_URL: ${{ inputs.base_url }}
          TENANT: ${{ inputs.tenant }}
          PROFILE: ${{ inputs.profile }}
          STAFF_USER: ${{ secrets.LOADTEST_STAFF_USER }}
          STAFF_PASSWORD: ${{ secrets.LOADTEST_STAFF_PASSWORD }}
        run: k6 run --summary-export=summary.json loadtest/k6/cims.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: summary.json
